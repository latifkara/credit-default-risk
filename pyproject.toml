[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-sat"
version = "0.2.0"
description = "Leakage-free, configurable tabular classification pipeline (Home Credit style default prediction)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.17,<3"]
zenml = ["zenml>=0.84.3", "mlflow>=2.17,<3", "sqlalchemy>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pre-commit>=3.7"]

[project.scripts]
customer-sat = "customer_sat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
customer_sat = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# ZenML < 0.90 only recognises typing.Tuple (not builtin tuple[...]) for multi-output steps
"src/customer_sat/zenml_pipeline.py" = ["UP006", "UP035"]
